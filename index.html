<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReviewPilot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#6685ff;color:white;font-weight:bold}
button:hover{opacity:.85}
.secondary{background:#1b2640}
.danger{background:#733344}
input,textarea,select{background:#111a2d;color:white;border:1px solid #283650;border-radius:10px;padding:12px;width:100%}
.container{max-width:1200px;margin:auto;padding:25px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.logo{font-size:25px;font-weight:bold}.logo span{color:#6685ff}
.panel{background:#121a2c;border:1px solid #27344d;border-radius:15px;padding:20px}
.hidden{display:none!important}
.auth{max-width:450px;margin:10vh auto}
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}
.sidebar button{width:100%;margin:6px 0;text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
.stat{background:#121a2c;border:1px solid #27344d;border-radius:15px;padding:20px}
.stat strong{display:block;font-size:28px;margin-top:10px}
.muted{color:#9aabc8}
.reviews{display:grid;gap:15px}
.review{background:#172238;border:1px solid #27344d;border-radius:14px;padding:17px}
.stars{color:#ffca63}
.reply{border-top:1px solid #27344d;margin-top:12px;padding-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:30px;color:#9aabc8}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px}
.modalbox{background:#121a2c;border:1px solid #27344d;border-radius:16px;padding:20px;width:100%;max-width:500px}
.form{display:grid;gap:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#27344d;padding:15px;border-radius:12px;z-index:20}
@media(max-width:750px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.container{padding:14px}}
</style>
</head>
<body>
<div class="container">

<header>
<div class="logo">Review<span>Pilot</span></div>
<div id="user" class="muted"></div>
</header>

<div id="auth" class="panel auth">
<h2>Bienvenue sur ReviewPilot</h2>
<p class="muted">Connecte-toi à ton espace.</p>
<div class="form">
<input id="email" type="email" placeholder="Adresse e-mail">
<input id="password" type="password" placeholder="Mot de passe">
<button id="loginBtn">Connexion</button>
<button class="secondary" id="signupBtn">Créer un compte</button>
<p id="authmsg" class="muted"></p>
</div>
</div>

<div id="app" class="hidden">
<div class="layout">

<aside class="panel">
<h3>Entreprise</h3>
<select id="businessSelect"></select>
<button class="secondary" id="addBusinessBtn">+ Ajouter une entreprise</button>
<hr style="border-color:#27344d;margin:20px 0">
<button id="addReviewBtn">+ Ajouter un avis</button>
<button class="secondary" id="refreshBtn">Actualiser</button>
<button class="secondary" id="logoutBtn">Déconnexion</button>
</aside>

<main>
<div class="stats">
<div class="stat"><span class="muted">Nombre d'avis</span><strong id="total">0</strong></div>
<div class="stat"><span class="muted">Note moyenne</span><strong id="average">—</strong></div>
<div class="stat"><span class="muted">Réponses</span><strong id="answered">0</strong></div>
</div>

<div class="panel">
<div class="row" style="justify-content:space-between;margin-bottom:20px">
<h2>Avis clients</h2>
<input id="search" placeholder="Rechercher..." style="max-width:250px">
</div>
<div id="reviews" class="reviews"></div>
</div>
</main>
</div>
</div>
</div>

<div id="modal" class="modal hidden">
<div class="modalbox">
<div class="row" style="justify-content:space-between">
<h2 id="modalTitle">Ajouter</h2>
<button class="secondary" id="closeBtn">X</button>
</div>
<div id="modalContent"></div>
</div>
</div>

<div id="toast" class="hidden"></div>

<script>
// ===== SUPABASE CONFIGURATION =====
const SUPABASE_URL = "https://inxhsusboqqodxaqfqvi.supabase.co";
const SUPABASE_KEY = "sb_publishable_8HXU_WVC3XzFWPyeZ_59yg_h3M2NCdx";
// ================================

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let businesses=[];
let reviews=[];
let activeBusiness=null;

const $=id=>document.getElementById(id);

function toast(text){
 $("toast").textContent=text;
 $("toast").classList.remove("hidden");
 setTimeout(()=>$("toast").classList.add("hidden"),3000);
}

function esc(text){
 return String(text??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function openModal(title,content){
 $("modalTitle").textContent=title;
 $("modalContent").innerHTML=content;
 $("modal").classList.remove("hidden");
}

function closeModal(){
 $("modal").classList.add("hidden");
}

$("closeBtn").onclick=closeModal;

// AUTH
$("signupBtn").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;

 const {error}=await sb.auth.signUp({email,password});

 $("authmsg").textContent=error?
 error.message:"Compte créé. Vérifie ton e-mail si nécessaire.";
};

$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;

 const {data,error}=await sb.auth.signInWithPassword({email,password});

 if(error){
 $("authmsg").textContent=error.message;
 return;
 }

 start(data.user);
};

$("logoutBtn").onclick=async()=>{
 await sb.auth.signOut();
 location.reload();
};

async function start(user){
 currentUser=user;
 $("auth").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("user").textContent=user.email;
 await loadBusinesses();
}

sb.auth.getSession().then(({data})=>{
 if(data.session)start(data.session.user);
});

// BUSINESS
async function loadBusinesses(){
 const {data,error}=await sb
 .from("businesses")
 .select("*")
 .order("created_at",{ascending:false});

 if(error){
 toast(error.message);
 return;
 }

 businesses=data||[];

 $("businessSelect").innerHTML=businesses.map(b=>
 `<option value="${b.id}">${esc(b.name)}</option>`
 ).join("");

 if(!businesses.length){
 activeBusiness=null;
 reviews=[];
 render();
 return;
 }

 activeBusiness=$("businessSelect").value||businesses[0].id;
 $("businessSelect").value=activeBusiness;

 await loadReviews();
}

$("businessSelect").onchange=async()=>{
 activeBusiness=$("businessSelect").value;
 await loadReviews();
};

$("addBusinessBtn").onclick=()=>{
 openModal("Ajouter une entreprise",`
 <div class="form">
 <input id="bizname" placeholder="Nom de l'entreprise">
 <button id="saveBusinessBtn">Enregistrer</button>
 </div>`);
};

$("modalContent").addEventListener("click",async e=>{
 if(e.target.id==="saveBusinessBtn"){
 const name=$("bizname").value.trim();
 if(!name)return toast("Nom requis");

 const {error}=await sb.from("businesses").insert({
 name,
 owner_id:currentUser.id
 });

 if(error)return toast(error.message);

 closeModal();
 await loadBusinesses();
 toast("Entreprise ajoutée");
 }
});

// REVIEWS
async function loadReviews(){
 if(!activeBusiness){
 reviews=[];
 render();
 return;
 }

 const {data,error}=await sb
 .from("reviews")
 .select("*")
 .eq("business_id",activeBusiness)
 .order("created_at",{ascending:false});

 if(error){
 toast(error.message);
 return;
 }

 reviews=data||[];
 render();
}

$("refreshBtn").onclick=loadReviews;
$("search").oninput=render;

function render(){
 const search=$("search").value.toLowerCase();

 const filtered=reviews.filter(r=>
 (r.review_text||"").toLowerCase().includes(search)||
 (r.reply_text||"").toLowerCase().includes(search)
 );

 $("total").textContent=reviews.length;

 $("average").textContent=reviews.length
 ?(reviews.reduce((a,r)=>a+Number(r.rating),0)/reviews.length).toFixed(1)+" / 5"
 :"—";

 $("answered").textContent=
 reviews.filter(r=>r.reply_text&&r.reply_text.trim()).length;

 if(!filtered.length){
 $("reviews").innerHTML=
 `<div class="empty">${reviews.length?"Aucun résultat":"Aucun avis enregistré"}</div>`;
 return;
 }

 $("reviews").innerHTML=filtered.map(r=>`
 <div class="review">
 <div class="row" style="justify-content:space-between">
 <div class="stars">${"★".repeat(Number(r.rating))}${"☆".repeat(5-Number(r.rating))}</div>
 <button class="danger" data-delete="${r.id}">Supprimer</button>
 </div>

 <p>${esc(r.review_text)}</p>

 <div class="muted">
 ${r.created_at?new Date(r.created_at).toLocaleDateString("fr-FR"):""}
 </div>

 <div class="reply">
 <strong>Réponse</strong>
 <p>${r.reply_text?esc(r.reply_text):'<span class="muted">Aucune réponse</span>'}</p>
 <button class="secondary" data-edit="${r.id}">
 ${r.reply_text?"Modifier":"Ajouter"}
 </button>
 </div>
 </div>
 `).join("");
}

$("reviews").addEventListener("click",async e=>{
 const del=e.target.dataset.delete;
 const edit=e.target.dataset.edit;

 if(del){
 if(!confirm("Supprimer cet avis ?"))return;

 const {error}=await sb.from("reviews").delete().eq("id",del);

 if(error)return toast(error.message);

 await loadReviews();
 toast("Avis supprimé");
 }

 if(edit){
 const r=reviews.find(x=>x.id===edit);

 openModal("Réponse",`
 <div class="form">
 <textarea id="replyEdit" rows="5">${esc(r.reply_text||"")}</textarea>
 <button id="saveReplyBtn">Enregistrer</button>
 </div>`);

 $("saveReplyBtn").onclick=async()=>{
 const reply=$("replyEdit").value.trim();

 const {error}=await sb.from("reviews")
 .update({reply_text:reply||null})
 .eq("id",edit);

 if(error)return toast(error.message);

 closeModal();
 await loadReviews();
 toast("Réponse enregistrée");
 };
 }
});

// ADD REVIEW
$("addReviewBtn").onclick=()=>{
 if(!activeBusiness)return toast("Ajoute d'abord une entreprise");

 openModal("Ajouter un avis",`
 <div class="form">
 <select id="rating">
 <option value="5">5 étoiles</option>
 <option value="4">4 étoiles</option>
 <option value="3">3 étoiles</option>
 <option value="2">2 étoiles</option>
 <option value="1">1 étoile</option>
 </select>

 <textarea id="reviewText" rows="4" placeholder="Texte de l'avis"></textarea>

 <textarea id="replyText" rows="3" placeholder="Réponse (facultative)"></textarea>

 <button id="saveReviewBtn">Enregistrer</button>
 </div>`);

 $("saveReviewBtn").onclick=async()=>{
 const text=$("reviewText").value.trim();
 if(!text)return toast("Avis requis");

 const {error}=await sb.from("reviews").insert({
 business_id:activeBusiness,
 rating:Number($("rating").value),
 review_text:text,
 reply_text:$("replyText").value.trim()||null
 });

 if(error)return toast(error.message);

 closeModal();
 await loadReviews();
 toast("Avis enregistré");
 };
};
</script>
</body>
</html>
